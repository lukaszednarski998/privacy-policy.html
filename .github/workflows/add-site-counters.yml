name: Add ARVION visits and hearts counters

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/add-site-counters.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add visits and hearts counters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          stats_css = '''\n/* ARVION SITE STATS START */\n.site-stats{display:flex;align-items:center;gap:8px;flex:0 0 auto}.site-stat{height:38px;display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(216,170,67,.42);background:linear-gradient(180deg,#151109,#090806);color:#e8d39d;border-radius:999px;padding:0 12px;font-size:11px;font-weight:900;letter-spacing:.07em;white-space:nowrap}.site-stat .stat-icon{font-size:16px;line-height:1}.site-stat .stat-count{color:var(--gold2);font-size:13px;min-width:18px;text-align:center}.site-like{cursor:pointer;transition:.2s ease}.site-like:hover{border-color:var(--gold2);transform:translateY(-1px)}.site-like.liked{background:linear-gradient(180deg,#341018,#16080b);border-color:#d85a72;color:#ffd5dc}.site-like.liked .stat-icon{color:#ff5d78}.site-like:disabled{cursor:default;opacity:.85}.stats-offline .stat-count{color:#777}@media(max-width:1120px){.site-stat{padding:0 9px}.site-stat .stat-label{display:none}.header-actions{gap:12px}nav{gap:15px}}@media(max-width:760px){.top{gap:10px}.site-stats{margin-left:auto}.site-stat{height:36px;padding:0 9px}.brand span{display:none}.header-actions{gap:8px}.support-link{padding:9px 11px;font-size:12px}}@media(max-width:520px){.site-stat{padding:0 7px}.site-stat .stat-icon{font-size:14px}.site-stat .stat-count{font-size:12px}.header-actions{gap:5px}.support-link{padding:8px 9px;font-size:11px}}\n/* ARVION SITE STATS END */\n'''
          if '/* ARVION SITE STATS START */' in s:
              s = re.sub(r'/\* ARVION SITE STATS START \*/.*?/\* ARVION SITE STATS END \*/\n?', stats_css, s, count=1, flags=re.S)
          else:
              s = s.replace('</style>', stats_css + '\n</style>', 1)

          stats_html = '''<div class="site-stats" id="siteStats" aria-label="ARVION website statistics"><div class="site-stat" title="Website visits / Odwiedziny strony"><span class="stat-icon" aria-hidden="true">◉</span><span class="stat-label">VISITS</span><span class="stat-count" id="visitCount">—</span></div><button class="site-stat site-like" id="heartButton" type="button" title="Add a heart / Dodaj serduszko" aria-label="Add a heart"><span class="stat-icon" aria-hidden="true">♥</span><span class="stat-label">LIKES</span><span class="stat-count" id="heartCount">—</span></button></div>'''
          if 'id="siteStats"' not in s:
              s = s.replace('<div class="header-actions">', stats_html + '<div class="header-actions">', 1)

          stats_js = r'''
          // ARVION SITE STATS START
          const arvionCounterBase='https://countapi.mileshilliard.com/api/v1';
          const arvionViewKey='arvion_lukaszednarski998_site_views_v1';
          const arvionHeartKey='arvion_lukaszednarski998_site_hearts_v1';
          const visitCountEl=document.getElementById('visitCount'),heartCountEl=document.getElementById('heartCount'),heartButton=document.getElementById('heartButton');
          async function arvionCounter(key,mode='get'){
            try{
              const r=await fetch(`${arvionCounterBase}/${mode}/${encodeURIComponent(key)}`,{cache:'no-store'});
              if(!r.ok){if(mode==='get'&&r.status===404)return 0;throw new Error('counter '+r.status)}
              const d=await r.json();
              return Number.isFinite(Number(d.value))?Number(d.value):0;
            }catch(e){console.warn('ARVION counter unavailable',e);return null}
          }
          function formatStat(n){return n===null?'—':new Intl.NumberFormat().format(n)}
          async function initArvionStats(){
            let countVisit=true;
            try{if(sessionStorage.getItem('arvionVisitCountedV1'))countVisit=false;else sessionStorage.setItem('arvionVisitCountedV1','1')}catch(e){}
            const views=await arvionCounter(arvionViewKey,countVisit?'hit':'get');
            visitCountEl.textContent=formatStat(views);
            if(views===null)visitCountEl.closest('.site-stat').classList.add('stats-offline');
            let liked=false;
            try{liked=localStorage.getItem('arvionHeartGivenV1')==='1'}catch(e){}
            const hearts=await arvionCounter(arvionHeartKey,'get');
            heartCountEl.textContent=formatStat(hearts);
            if(hearts===null)heartButton.classList.add('stats-offline');
            if(liked){heartButton.classList.add('liked');heartButton.setAttribute('aria-label','Heart already added / Serduszko już dodane');heartButton.title='Thank you! / Dziękujemy!'}
          }
          heartButton.addEventListener('click',async()=>{
            let liked=false;
            try{liked=localStorage.getItem('arvionHeartGivenV1')==='1'}catch(e){}
            if(liked){heartButton.classList.add('liked');return}
            heartButton.disabled=true;
            const hearts=await arvionCounter(arvionHeartKey,'hit');
            if(hearts!==null){
              heartCountEl.textContent=formatStat(hearts);
              heartButton.classList.add('liked');
              heartButton.classList.remove('stats-offline');
              heartButton.title='Thank you! / Dziękujemy!';
              heartButton.setAttribute('aria-label','Heart added / Serduszko dodane');
              try{localStorage.setItem('arvionHeartGivenV1','1')}catch(e){}
            }
            heartButton.disabled=false;
          });
          initArvionStats();
          // ARVION SITE STATS END
          '''
          # Dedent only the JavaScript payload from this Python heredoc.
          stats_js = '\n'.join(line[10:] if line.startswith('          ') else line for line in stats_js.splitlines()) + '\n'
          if '// ARVION SITE STATS START' in s:
              s = re.sub(r'// ARVION SITE STATS START.*?// ARVION SITE STATS END\n?', stats_js, s, count=1, flags=re.S)
          else:
              s = s.replace("render();setSupportLang('en');", stats_js + "\nrender();setSupportLang('en');", 1)

          s = re.sub(r'<meta name="arvion-site-version" content="[^"]+">', '<meta name="arvion-site-version" content="2026-08-29-1155-stats">', s, count=1)
          p.write_text(s, encoding='utf-8')

          gp = Path('scripts/update_catalog.py')
          g = gp.read_text(encoding='utf-8')
          guard = '''\n# Keep the visits and hearts counters between the ARVION brand and Phone Apps navigation.\nif 'id="siteStats"' not in s:\n    stats_html = '<div class="site-stats" id="siteStats" aria-label="ARVION website statistics"><div class="site-stat" title="Website visits / Odwiedziny strony"><span class="stat-icon" aria-hidden="true">◉</span><span class="stat-label">VISITS</span><span class="stat-count" id="visitCount">—</span></div><button class="site-stat site-like" id="heartButton" type="button" title="Add a heart / Dodaj serduszko" aria-label="Add a heart"><span class="stat-icon" aria-hidden="true">♥</span><span class="stat-label">LIKES</span><span class="stat-count" id="heartCount">—</span></button></div>'\n    s = s.replace('<div class="header-actions">', stats_html + '<div class="header-actions">', 1)\n'''
          if '# Keep the visits and hearts counters between the ARVION brand and Phone Apps navigation.' not in g:
              marker = '# Replace the old single filterable catalog with three fixed sections.'
              g = g.replace(marker, guard + '\n' + marker, 1)
          gp.write_text(g, encoding='utf-8')
          PY

      - name: Commit counters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/update_catalog.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add visits and hearts counters"
          git push
