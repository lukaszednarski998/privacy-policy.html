name: List three app assets
on:
  push:
    paths: ['.github/workflows/list-new-apps.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -Z1 'DO STRONY.zip' > archive-inspection/new-app-files.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive-inspection/new-app-files.txt
          git commit -m 'List uploaded applications' || true
          git push
