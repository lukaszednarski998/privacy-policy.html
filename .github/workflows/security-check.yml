name: ARVION public-site security checks
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "index*.html"
      - "scripts/update_support.py"
      - ".github/workflows/security-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/*.js; do
            node --check "$f"
          done
      - name: Prevent exposure of support details
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path("assets/support-captcha.js"), *Path(".").glob("index*.html")]
          bad = []
          for p in paths:
              if not p.is_file():
                  continue
              content = p.read_text(encoding="utf-8")
              if re.search(r"\\bPL\\d{26}\\b|\\b\\d{2}(?:[ -]?\\d{4}){6}\\b", content):
                  bad.append(f"{p}: possible bank account number")
              if p.name == "support-captcha.js" and ("decodeDetails()" in content or "var PACK=" in content):
                  bad.append(f"{p}: reversible private data")
          if bad:
              raise SystemExit("\\n".join(bad))
          print("Public support details check passed.")
          PY
