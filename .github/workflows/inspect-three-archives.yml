name: Inspect three website archives

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-three-archives.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archives separately
        shell: bash
        run: |
          set -euo pipefail
          rm -rf archive-inspection
          mkdir -p archive-inspection
          for f in "DO STRONY INTERNETOWEJ.part1.rar" "DO STRONY INTERNETOWEJ.part2.rar" "STRONA INTERNETOWA.zip"; do
            out="archive-inspection/$(echo "$f" | tr ' /' '__').txt"
            echo "ARCHIVE: $f" > "$out"
            echo "SIZE: $(stat -c %s "$f")" >> "$out"
            echo >> "$out"
            7z l -ba "$f" >> "$out" 2>&1 || true
          done
      - name: Commit inspection manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive-inspection
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inspect three website archives separately"
          git push
