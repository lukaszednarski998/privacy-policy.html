name: Update Support text
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_support.py"
      - ".github/workflows/update-support.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Support section
        run: python scripts/update_support.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Support biography"
            git push
          fi
