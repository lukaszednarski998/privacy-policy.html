name: Force Pages refresh 2026-09-11

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/force-pages-refresh-20260911.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump site version marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<meta name="arvion-site-version" content="[^"]+">','<meta name="arvion-site-version" content="2026-09-11-games-media-refresh-2">',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Force publish latest game media"
          git push
