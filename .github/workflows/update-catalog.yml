name: Update ARVION catalog

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_catalog.py"
      - ".github/workflows/update-catalog.yml"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.event_name != 'issues' || github.event.issue.title == '[ARVION IMPORT NEW PRODUCT IMAGES]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded split archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/imported-new-products
          mkdir -p assets/imported-new-products
          7z x "assets/new-product-images/STRONA INTERNETOWA.zip" "-oassets/imported-new-products" -y
          find assets/imported-new-products -type f -printf '%P\n' | sort > assets/imported-new-products/MANIFEST.txt

      - name: Update catalog
        run: python scripts/update_catalog.py

      - name: Commit imported originals and updated website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/imported-new-products
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "Import new product images and update catalog"
          git push
