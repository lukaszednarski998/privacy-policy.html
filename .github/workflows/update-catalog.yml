name: Update ARVION catalog

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_catalog.py"
      - ".github/workflows/update-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update catalog
        run: python scripts/update_catalog.py

      - name: Commit updated website
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update ARVION product catalog"
          git push
