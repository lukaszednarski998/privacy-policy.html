name: Attach latest product catalog module
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/attach-latest-products.yml
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/latest-products.js?v=20260903"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+chr(10)+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load latest ARVION product catalog"
          git push
# retrigger after cleanup
