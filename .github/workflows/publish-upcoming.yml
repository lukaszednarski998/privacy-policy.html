name: Publish three upcoming apps
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-upcoming.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/import_three_apps.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/coming-soon/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add three upcoming applications to catalog"
          git push
