name: Inspect completed October 13 split archive
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-complete-strona-oct13.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: List and extract today's complete uploaded archive
        shell: bash
        run: |
          mkdir -p archive-inspection
          mkdir -p /tmp/strona-complete
          7z l -slt 'STRONA INTERNETOWA.zip' > /tmp/archive-list.txt 2>&1 || true
          7z x 'STRONA INTERNETOWA.zip' -o/tmp/strona-complete -y > /tmp/archive-extract.txt 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          import json,collections
          out=Path('archive-inspection/strona-20261013-complete.md')
          root=Path('/tmp/strona-complete')
          files=sorted(p for p in root.rglob('*') if p.is_file())
          lines=['# Uploaded October 13 split archive with all 3 volumes', '', 'Volumes:', '']
          for name in ('STRONA INTERNETOWA.z01','STRONA INTERNETOWA.z02','STRONA INTERNETOWA.zip'):
              p=Path(name);lines.append(f'- {name}: {p.stat().st_size if p.exists() else "MISSING"} bytes')
          lines.extend(['','## Extraction output','', '~~~',Path('/tmp/archive-extract.txt').read_text(errors='replace')[-2600:],'~~~','',f'## Extracted files: {len(files)}',''])
          for p in files[:300]:
              lines.append(f'- {p.relative_to(root).as_posix()} ({p.stat().st_size} bytes)')
          lines.extend(['','## Zip entries matching application folders',''])
          raw=Path('/tmp/archive-list.txt').read_text(errors='replace')
          for line in raw.splitlines():
              if line.startswith('Path = ') or line.startswith('Errors:') or line.startswith('Warnings:'):
                  lines.append(line)
          out.write_text('\n'.join(lines)+'\n',encoding='utf8')
          print('\n'.join(lines)[:12000])
          PY
      - name: Commit detailed file list
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive-inspection/strona-20261013-complete.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inspect complete October 13 five-app source archive'
          git pull --rebase origin main
          git push origin HEAD:main
