name: Update product availability
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_availability.py"
      - ".github/workflows/update-availability.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bilingual availability labels
        run: python scripts/update_availability.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add bilingual product availability labels"
            git push
          fi
