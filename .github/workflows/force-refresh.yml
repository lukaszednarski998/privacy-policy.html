name: Force ARVION Pages refresh

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/force-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force fresh browser version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          cache = '''<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n<meta http-equiv="Pragma" content="no-cache">\n<meta http-equiv="Expires" content="0">\n<meta name="arvion-site-version" content="2026-08-29-1005">'''
          if 'arvion-site-version' in s:
              import re
              s = re.sub(r'<meta http-equiv="Cache-Control".*?<meta name="arvion-site-version"[^>]*>', cache, s, count=1, flags=re.S)
          else:
              s = s.replace('<meta name="theme-color" content="#050505">', '<meta name="theme-color" content="#050505">\n' + cache, 1)
          s = s.replace('assets/banner-data/p${i}.txt?v=20260827real', 'assets/banner-data/p${i}.txt?v=20260829fresh')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit refreshed site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Force fresh ARVION site version"
          git push
