name: Import ARVION website upload

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/import-site-upload.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded split RAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "assets/user-upload-20260911"
          mkdir -p "assets/user-upload-20260911"
          7z x "DO STRONY INTERNETOWEJ.part1.rar" -o"assets/user-upload-20260911" -y
          find "assets/user-upload-20260911" -type f -printf '%P\n' | sort > "assets/user-upload-20260911/MANIFEST.txt"

      - name: Commit extracted website assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/user-upload-20260911"
          if git diff --cached --quiet; then
            echo "No extracted changes"
            exit 0
          fi
          git commit -m "Import ARVION website game assets"
          git push
