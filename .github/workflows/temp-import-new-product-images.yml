name: Temporary import new product images

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-import-new-product-images.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary import branch
        uses: actions/checkout@v4
        with:
          ref: temp-import-images
          fetch-depth: 0

      - name: Extract split ZIP without modifying originals
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/imported-new-products
          mkdir -p assets/imported-new-products
          7z x "assets/new-product-images/STRONA INTERNETOWA.zip" "-oassets/imported-new-products" -y
          find assets/imported-new-products -type f -printf '%P\n' | sort > assets/imported-new-products/MANIFEST.txt

      - name: Commit extracted originals to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/imported-new-products
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Extract new product images"
          git push origin HEAD:temp-import-images
