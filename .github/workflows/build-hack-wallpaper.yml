name: Build Hack Wallpaper APK

on:
  - push
  - workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK
        shell: bash
        run: gradle -p hack-wallpaper :app:assembleDebug --stacktrace
      - name: Prepare APK
        shell: bash
        run: cp hack-wallpaper/app/build/outputs/apk/debug/app-debug.apk HACK_THE_WORLD_LIVE_WALLPAPER.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HACK_THE_WORLD_LIVE_WALLPAPER_APK
          path: HACK_THE_WORLD_LIVE_WALLPAPER.apk
