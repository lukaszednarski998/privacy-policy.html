name: Build Hack Wallpaper APK

on:
  push:
    branches:
      - build-hack-wallpaper-20260914
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p hack-wallpaper :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp hack-wallpaper/app/build/outputs/apk/debug/app-debug.apk HACK_THE_WORLD_LIVE_WALLPAPER.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HACK_THE_WORLD_LIVE_WALLPAPER_APK
          path: HACK_THE_WORLD_LIVE_WALLPAPER.apk
          if-no-files-found: error
