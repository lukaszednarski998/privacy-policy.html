name: ARVION one-time SEO and Support hardening

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/site-hardening-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded site changes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          support_en = '''<div class="eyebrow">Support ARVION</div><h2>Independent Android development</h2><p>ARVION is an independent project creating Android and Wear OS applications, games and practical tools. The goal is simple: useful software without advertising and without mandatory recurring subscriptions.</p><div class="support-highlight"><h3>Buy once. Keep it.</h3><p>ARVION products are designed around one-time purchases with future improvements and updates included whenever they are released for that product.</p></div><h3>Want to help ARVION grow?</h3><p>If you would like to support future development, please use the <strong>Contact</strong> button in the top menu. Current support details can be provided privately when needed.</p><p class="privacy-note"><strong>Security:</strong> bank account numbers, BLIK phone numbers and private address details are not stored in the public source code of this website.</p><h3>Your feedback matters</h3><p>Bug reports, ideas and suggestions for new Android or Wear OS projects are always welcome. Thank you for every download, purchase, message and recommendation.</p>'''
          support_pl = '''<div class="eyebrow">Wesprzyj ARVION</div><h2>Niezależne tworzenie aplikacji</h2><p>ARVION to niezależny projekt tworzący aplikacje, gry i praktyczne narzędzia dla Androida oraz Wear OS. Zasada jest prosta: użyteczne oprogramowanie bez reklam i bez obowiązkowych cyklicznych subskrypcji.</p><div class="support-highlight"><h3>Kupujesz raz. Korzystasz dalej.</h3><p>Produkty ARVION są projektowane jako jednorazowy zakup, a przyszłe poprawki i aktualizacje są wliczone, gdy są wydawane dla danego produktu.</p></div><h3>Chcesz pomóc rozwijać ARVION?</h3><p>Jeżeli chcesz dobrowolnie wesprzeć dalszy rozwój, użyj przycisku <strong>Contact</strong> w górnym menu. Aktualne dane do wsparcia mogą zostać przekazane prywatnie, gdy będą potrzebne.</p><p class="privacy-note"><strong>Bezpieczeństwo:</strong> numery kont bankowych, numer telefonu BLIK i prywatny adres nie są przechowywane w publicznym kodzie źródłowym tej strony.</p><h3>Twoja opinia ma znaczenie</h3><p>Zgłoszenia błędów, pomysły i propozycje nowych projektów na Androida lub Wear OS są zawsze mile widziane. Dziękuję za każde pobranie, zakup, wiadomość i polecenie.</p>'''
          replacement = 'const supportCopy={en:`' + support_en + '`,pl:`' + support_pl + '`};'
          support_pattern = r"const supportCopy=\{en:`.*?`,pl:`.*?`\};"
          index2, count = re.subn(support_pattern, lambda m: replacement, index, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Guard failed: expected exactly one Support block, found {count}')

          obsolete_pattern = r"\n  // Support section: creator photo and transfer title are revealed by the same button as payment details\..*?\n  render\(\);\n  setSupportLang\(supportLang\);"
          index3, obsolete_count = re.subn(obsolete_pattern, '\n  render();\n  setSupportLang(supportLang);', index2, count=1, flags=re.S)
          if obsolete_count not in (0, 1):
              raise SystemExit('Guard failed while removing obsolete Support payment code')

          sensitive_markers = [
              '+48 797 053 984',
              '91 1050 0145 1000 0097 0803 3007',
              'PL91105001451000009708033007',
              'ul. Oławska 17/3',
          ]
          remaining = [x for x in sensitive_markers if x in index3]
          if remaining:
              raise SystemExit('Guard failed: sensitive Support data still present: ' + ', '.join(remaining))
          if 'const products=[' not in index3 or 'render();setSupportLang' not in index3 or '</html>' not in index3:
              raise SystemExit('Guard failed: main page structure check failed')
          index_path.write_text(index3, encoding='utf-8')

          sitemap = '''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://lukaszednarski998.github.io/privacy-policy.html/</loc>
              <lastmod>2026-09-04</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
            <url>
              <loc>https://lukaszednarski998.github.io/privacy-policy.html/apps/obd-active-exhaust-pro.html</loc>
              <lastmod>2026-09-04</lastmod>
              <changefreq>weekly</changefreq>
              <priority>0.9</priority>
            </url>
          </urlset>
          '''
          sitemap = '\n'.join(line.strip() for line in sitemap.strip().splitlines()) + '\n'
          Path('sitemap.xml').write_text(sitemap, encoding='utf-8')

          play = 'https://play.google.com/store/apps/details?id=com.obdactiveeeexhaust.pro'
          og_image = 'https://lukaszednarski998.github.io/privacy-policy.html/assets/imported-new-products/STRONA%20INTERNETOWA/OBD%20GLOWNA/OBD%201.png'
          obd = f'''<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="theme-color" content="#050505">
          <title>OBD Active Exhaust Pro | Android OBD2 Diagnostics & Live Data</title>
          <meta name="description" content="OBD Active Exhaust Pro combines active exhaust controls, OBD2 diagnostics, live vehicle data and driver tools for Android with compatible ELM327 adapters.">
          <link rel="canonical" href="https://lukaszednarski998.github.io/privacy-policy.html/apps/obd-active-exhaust-pro.html">
          <meta property="og:title" content="OBD Active Exhaust Pro | Android OBD2 Diagnostics & Live Data">
          <meta property="og:description" content="Active exhaust controls, Android OBD2 diagnostics, ELM327 live data and driver tools. No ads. No recurring subscriptions.">
          <meta property="og:type" content="website">
          <meta property="og:url" content="https://lukaszednarski998.github.io/privacy-policy.html/apps/obd-active-exhaust-pro.html">
          <meta property="og:image" content="{og_image}">
          <meta property="og:image:alt" content="OBD Active Exhaust Pro for Android">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="OBD Active Exhaust Pro">
          <meta name="twitter:description" content="Android OBD2 diagnostics, ELM327 live data and active exhaust tools.">
          <meta name="twitter:image" content="{og_image}">
          <script type="application/ld+json">{{"@context":"https://schema.org","@type":"SoftwareApplication","name":"OBD Active Exhaust Pro","operatingSystem":"Android","applicationCategory":"UtilitiesApplication","description":"Automotive Android app with active exhaust controls, OBD2 diagnostics and live vehicle data.","url":"https://lukaszednarski998.github.io/privacy-policy.html/apps/obd-active-exhaust-pro.html","downloadUrl":"{play}"}}</script>
          <style>
          :root{{--gold:#d8aa43;--gold2:#f1d17a}}*{{box-sizing:border-box}}body{{margin:0;background:radial-gradient(circle at 50% -10%,#202020 0,#080808 42%,#050505 75%);color:#f5f5f5;font-family:Arial,sans-serif}}.w{{max-width:920px;margin:auto;padding:48px 24px}}a{{color:var(--gold2)}}h1{{font-size:clamp(36px,6vw,58px);line-height:1.04;margin:12px 0 20px}}h2{{margin-top:34px;color:var(--gold2)}}p,li{{line-height:1.75;color:#c7c7c7}}.tag{{color:var(--gold2);font-weight:800;letter-spacing:.12em;font-size:12px}}.hero{{border:1px solid rgba(216,170,67,.35);border-radius:22px;padding:28px;background:linear-gradient(180deg,#111,#090909);margin-top:24px}}.play{{display:inline-flex;align-items:center;justify-content:center;min-height:54px;margin-top:20px;padding:0 24px;border-radius:14px;border:1px solid var(--gold);background:linear-gradient(180deg,#e2b84e,#a56f12);color:#080808;font-weight:900;text-decoration:none}}.note{{font-size:13px;color:#8f8f8f;margin-top:10px}}ul{{padding-left:22px}}
          </style>
          </head>
          <body><main class="w">
          <p><a href="../">← ARVION</a></p>
          <div class="hero"><div class="tag">ANDROID • OBD2 • ELM327 • AUTOMOTIVE</div><h1>OBD Active Exhaust Pro</h1><p>An Android automotive toolkit for compatible OBD/ELM327 connections. Use active exhaust functions, view live vehicle parameters, access diagnostics and additional driver tools in one clear interface.</p><a class="play" href="{play}" target="_blank" rel="noopener">GET IT ON GOOGLE PLAY</a><div class="note">Available now on Google Play.</div></div>
          <h2>No ads. No subscriptions.</h2><p>Designed as a one-time purchase without recurring subscription fees.</p>
          <h2>Key features</h2><ul><li>OBD2 / compatible ELM327 connectivity</li><li>Live vehicle data</li><li>Diagnostics tools</li><li>Active exhaust functions</li><li>Driver utilities</li></ul>
          <p><a href="../#phone-apps">View the ARVION catalog</a></p>
          </main></body></html>
          '''
          obd = '\n'.join(line.strip() for line in obd.strip().splitlines()) + '\n'
          if play not in obd or 'property="og:image"' not in obd or 'application/ld+json' not in obd:
              raise SystemExit('Guard failed: OBD SEO page validation failed')
          Path('apps/obd-active-exhaust-pro.html').write_text(obd, encoding='utf-8')

          print('Guarded changes prepared successfully.')
          PY

          grep -q '</html>' index.html
          grep -q 'DOSTĘPNA TERAZ' index.html
          grep -q 'com.obdactiveeeexhaust.pro' apps/obd-active-exhaust-pro.html
          grep -q 'og:image' apps/obd-active-exhaust-pro.html
          test "$(grep -c '<url>' sitemap.xml)" -eq 2

      - name: Commit verified changes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/site-hardening-once.yml
          git add index.html sitemap.xml apps/obd-active-exhaust-pro.html
          git diff --cached --check
          git commit -m "Harden Support and finalize OBD SEO"
          git push
