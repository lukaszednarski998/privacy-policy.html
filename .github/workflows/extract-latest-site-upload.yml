name: Extract latest site upload

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/extract-latest-site-upload.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install archive support
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip

      - name: Extract multipart RAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/latest-site-upload
          mkdir -p assets/latest-site-upload
          7z x -y -oassets/latest-site-upload "DO STRONY INTERNETOWEJ.part1.rar"
          find assets/latest-site-upload -type f -printf '%P\n' | sort > assets/latest-site-upload/MANIFEST.txt
          echo "Extracted files:"
          cat assets/latest-site-upload/MANIFEST.txt

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/latest-site-upload
          if git diff --cached --quiet; then
            echo "No extracted changes"
            exit 0
          fi
          git commit -m "Extract latest website upload"
          git push
