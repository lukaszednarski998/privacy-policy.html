name: Repair site visit and heart counters
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/fix_site_stats.py"
      - ".github/workflows/fix-site-stats.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair counters
        run: python scripts/fix_site_stats.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Repair site visit and heart counters"
            git push
          fi
